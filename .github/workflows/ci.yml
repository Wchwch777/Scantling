name: MoonBit MQTT Client and Test Peer CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      SCANTLING_MOSQUITTO_HOST: 127.0.0.1
      SCANTLING_MOSQUITTO_AUTH_HOST: 127.0.0.1
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Mosquitto broker
        run: |
          docker run --detach --rm --name scantling-mosquitto \
            --publish 1883:1883 \
            --volume "$GITHUB_WORKSPACE/.github/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.0.22
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs scantling-mosquitto
          exit 1
      - name: Start authenticated Mosquitto broker
        run: |
          mkdir -p "$RUNNER_TEMP/scantling-mosquitto-auth"
          docker run --rm --user 0:0 --entrypoint mosquitto_passwd \
            --volume "$RUNNER_TEMP/scantling-mosquitto-auth:/tmp" \
            eclipse-mosquitto:2.0.22 \
            -b -c /tmp/passwd scantling-test ci-password
          docker run --rm --user 0:0 --entrypoint chmod \
            --volume "$RUNNER_TEMP/scantling-mosquitto-auth:/tmp" \
            eclipse-mosquitto:2.0.22 644 /tmp/passwd
          docker run --detach --rm --name scantling-mosquitto-auth \
            --publish 1884:1883 \
            --volume "$GITHUB_WORKSPACE/.github/mosquitto-auth.conf:/mosquitto/config/mosquitto.conf:ro" \
            --volume "$RUNNER_TEMP/scantling-mosquitto-auth/passwd:/mosquitto/config/passwd:ro" \
            eclipse-mosquitto:2.0.22
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1884) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs scantling-mosquitto-auth
          exit 1
      - name: Install MoonBit toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.15+943464bfa'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: moon version --all
      - name: Update registry
        run: moon update
      - name: Format check
        run: moon fmt --check
      - name: Type check portable target
        run: moon check --target wasm
      - name: Run portable tests
        run: moon test --target wasm
      - name: Type check native client
        run: moon check --target native
      - name: Run native integration tests
        run: moon test --target native
      - name: Run MQTT client example against Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/scantling-mqtt-client-example.log"
          started_at="$(date +%s)"
          timeout --signal=TERM --kill-after=2s 30s \
            moon run --target native examples/mqtt_client 2>&1 | tee "$output_file"
          elapsed="$(( $(date +%s) - started_at ))"
          test "$elapsed" -ge 10
          grep -Fq 'telemetry demo/sensor/temperature: b"21.5"' "$output_file"
          grep -Fq 'device applied command: b"SET_TEMP=22.0"' "$output_file"
          grep -Fq 'reported state demo/device/device-7/reported: b"temperature=22.0"' "$output_file"
          grep -Fq 'event demo/service/orders/created: b"order_id=demo-1"' "$output_file"
      - name: Install independent MQTT client
        run: sudo apt-get update && sudo apt-get install --yes mosquitto-clients
      - name: Verify the fault peer with Mosquitto clients
        shell: bash
        run: |
          set -euo pipefail
          peer_pid=""
          cleanup_peer() {
            if [[ -n "$peer_pid" ]]; then
              kill "$peer_pid" 2>/dev/null || true
              wait "$peer_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_peer EXIT
          run_peer_case() {
            local scenario="$1"
            local qos="$2"
            local port="$3"
            local mode="$4"
            local log="$RUNNER_TEMP/scantling-${scenario}.log"
            local client_log="$RUNNER_TEMP/scantling-${scenario}-mosquitto-pub.log"
            timeout --signal=TERM --kill-after=2s 30s \
              env SCANTLING_FAULT_SCENARIO="$scenario" \
              SCANTLING_FAULT_PORT="$port" \
              moon run --target native examples/mqtt_fault_peer >"$log" 2>&1 &
            peer_pid=$!
            for attempt in $(seq 1 30); do
              if grep -q 'listening on 127.0.0.1:' "$log"; then
                break
              fi
              if ! kill -0 "$peer_pid" 2>/dev/null; then
                cat "$log"
                return 1
              fi
              sleep 1
            done
            if ! grep -q 'listening on 127.0.0.1:' "$log"; then
              cat "$log"
              kill "$peer_pid" 2>/dev/null || true
              wait "$peer_pid" 2>/dev/null || true
              peer_pid=""
              return 1
            fi
            if [[ "$mode" == "reject-connect" ]]; then
              local client_status=0
              if timeout --signal=TERM --kill-after=2s 15s \
                mosquitto_pub -V mqttv311 -d -h 127.0.0.1 -p "$port" \
                -t scantling/ci/rejected -m rejected >"$client_log" 2>&1; then
                cat "$client_log"
                echo "mosquitto_pub unexpectedly accepted a Not Authorized CONNACK"
                return 1
              else
                client_status="$?"
              fi
              cat "$client_log"
              test "$client_status" -eq 5
              grep -Fq 'received CONNACK (5)' "$client_log"
            elif [[ "$mode" == "truncate-connack" ]]; then
              local client_status=0
              if timeout --signal=TERM --kill-after=2s 15s \
                mosquitto_pub -V mqttv311 -d -h 127.0.0.1 -p "$port" \
                -t scantling/ci/truncated -m truncated >"$client_log" 2>&1; then
                cat "$client_log"
                echo "mosquitto_pub unexpectedly accepted a truncated CONNACK"
                return 1
              else
                client_status="$?"
              fi
              cat "$client_log"
              if [[ "$client_status" -eq 124 || "$client_status" -eq 137 ]]; then
                echo "mosquitto_pub timed out waiting for the truncated-CONNACK result"
                return 1
              fi
            else
              if ! timeout --signal=TERM --kill-after=2s 15s \
                mosquitto_pub -V mqttv311 -h 127.0.0.1 -p "$port" \
                -t scantling/ci/interop -m "qos-${qos}" -q "$qos"; then
                cat "$log"
                kill "$peer_pid" 2>/dev/null || true
                wait "$peer_pid" 2>/dev/null || true
                peer_pid=""
                return 1
              fi
            fi
            if ! wait "$peer_pid"; then
              cat "$log"
              peer_pid=""
              return 1
            fi
            peer_pid=""
          }
          run_peer_case accept-publish-qos0 0 1885 publish
          run_peer_case accept-publish-qos1 1 1886 publish
          run_peer_case reject-connect 0 1887 reject-connect
          run_peer_case truncate-connack 0 1888 truncate-connack
          start_script_peer() {
            local script="$1"
            local port="$2"
            local name="$3"
            peer_log="$RUNNER_TEMP/scantling-${name}.log"
            timeout --signal=TERM --kill-after=2s 30s \
              env SCANTLING_FAULT_SCRIPT="$script" \
              SCANTLING_FAULT_PORT="$port" \
              moon run --target native examples/mqtt_fault_peer >"$peer_log" 2>&1 &
            peer_pid=$!
            for attempt in $(seq 1 30); do
              if grep -q 'listening on 127.0.0.1:' "$peer_log"; then
                return 0
              fi
              if ! kill -0 "$peer_pid" 2>/dev/null; then
                cat "$peer_log"
                peer_pid=""
                return 1
              fi
              sleep 1
            done
            cat "$peer_log"
            kill "$peer_pid" 2>/dev/null || true
            wait "$peer_pid" 2>/dev/null || true
            peer_pid=""
            return 1
          }
          run_custom_script_case() {
            local port="$1"
            local script="examples/mqtt_fault_peer/scripts/server-unavailable.scantling"
            local client_log="$RUNNER_TEMP/scantling-custom-script-mosquitto.log"
            start_script_peer "$script" "$port" custom-script
            local client_status=0
            if timeout --signal=TERM --kill-after=2s 15s \
              mosquitto_pub -V mqttv311 -d -h 127.0.0.1 -p "$port" \
              -t scantling/ci/custom-script -m unavailable >"$client_log" 2>&1; then
              cat "$client_log"
              echo "mosquitto_pub unexpectedly accepted a custom CONNACK rejection"
              return 1
            else
              client_status="$?"
            fi
            cat "$client_log"
            test "$client_status" -eq 3
            grep -Fq 'received CONNACK (3)' "$client_log"
            if ! wait "$peer_pid"; then
              cat "$peer_log"
              peer_pid=""
              return 1
            fi
            peer_pid=""
          }
          run_custom_script_case 1889
          run_scripted_subscription_case() {
            local port="$1"
            local script="examples/mqtt_fault_peer/scripts/subscriber-message.scantling"
            local client_log="$RUNNER_TEMP/scantling-scripted-subscription-mosquitto.log"
            start_script_peer "$script" "$port" scripted-subscription
            if ! timeout --signal=TERM --kill-after=2s 15s \
              mosquitto_sub -V mqttv311 -h 127.0.0.1 -p "$port" \
              -t scantling/scripted/notice -q 0 -C 1 -W 10 -v \
              >"$client_log" 2>&1; then
              cat "$peer_log"
              cat "$client_log"
              kill "$peer_pid" 2>/dev/null || true
              wait "$peer_pid" 2>/dev/null || true
              peer_pid=""
              return 1
            fi
            cat "$client_log"
            grep -Fxq 'scantling/scripted/notice scripted-message' "$client_log"
            if ! wait "$peer_pid"; then
              cat "$peer_log"
              peer_pid=""
              return 1
            fi
            peer_pid=""
          }
          run_scripted_subscription_case 1890
          run_scripted_qos2_case() {
            local port="$1"
            local script="examples/mqtt_fault_peer/scripts/qos2-publish.scantling"
            local client_log="$RUNNER_TEMP/scantling-scripted-qos2-mosquitto.log"
            start_script_peer "$script" "$port" scripted-qos2
            if ! timeout --signal=TERM --kill-after=2s 15s \
              mosquitto_pub -V mqttv311 -d -h 127.0.0.1 -p "$port" \
              -t scantling/ci/qos2 -m qos2-message -q 2 >"$client_log" 2>&1; then
              cat "$peer_log"
              cat "$client_log"
              kill "$peer_pid" 2>/dev/null || true
              wait "$peer_pid" 2>/dev/null || true
              peer_pid=""
              return 1
            fi
            cat "$client_log"
            if ! wait "$peer_pid"; then
              cat "$peer_log"
              peer_pid=""
              return 1
            fi
            peer_pid=""
          }
          run_scripted_qos2_case 1891
          run_scripted_idle_event_case() {
            local port="$1"
            local script="examples/mqtt_fault_peer/scripts/idle-event.scantling"
            local client_log="$RUNNER_TEMP/scantling-idle-event-mosquitto.log"
            start_script_peer "$script" "$port" idle-event
            if ! timeout --signal=TERM --kill-after=2s 20s \
              mosquitto_sub -V mqttv311 -d -h 127.0.0.1 -p "$port" \
              -k 5 -t scantling/idle/event -q 0 -C 1 -W 15 -v \
              >"$client_log" 2>&1; then
              cat "$peer_log"
              cat "$client_log"
              kill "$peer_pid" 2>/dev/null || true
              wait "$peer_pid" 2>/dev/null || true
              peer_pid=""
              return 1
            fi
            cat "$client_log"
            grep -Fxq 'scantling/idle/event after-idle' "$client_log"
            local pingreq_count
            local pingresp_count
            pingreq_count="$(grep -Fc 'PINGREQ' "$client_log" || true)"
            pingresp_count="$(grep -Fc 'PINGRESP' "$client_log" || true)"
            test "$pingreq_count" -ge 2
            test "$pingresp_count" -ge 2
            if ! wait "$peer_pid"; then
              cat "$peer_log"
              peer_pid=""
              return 1
            fi
            peer_pid=""
          }
          run_scripted_idle_event_case 1892
      - name: Stop Mosquitto broker
        if: always()
        run: |
          docker rm --force scantling-mosquitto scantling-mosquitto-auth 2>/dev/null || true
