name: Scantling CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      # Linux CI run 36086484531 installed this release successfully on ubuntu-22.04.
      # Pin the installer input so subsequent CI runs do not silently drift.
      - name: Install MoonBit toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.1.20260920
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: moon version --all
      - name: Run repository verification
        shell: bash
        run: bash scripts/ci.sh
      - name: Verify WebAssembly build
        shell: bash
        run: bash scripts/build_wasm.sh
